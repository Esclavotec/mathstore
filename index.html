<!--
  MathStore: tienda de juegos y material didáctico de matemáticas.
  Esta página no lleva <html>/<head>/<body> explícitos a propósito: así el mismo
  archivo sirve en GitHub Pages (el navegador los crea solo) y como artefacto
  publicado (que añade su propio esqueleto).
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MathStore</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tienda de juegos y material didáctico de matemáticas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/styles.css">

<header class="barra">
  <div class="barra-in">
    <a class="marca" href="#" aria-label="MathStore, inicio">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="7" fill="var(--tiza-amarilla)"/>
        <path d="M7 12h8M11 8v8M18 18l6 6M24 18l-6 6" stroke="var(--pizarra)" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span>Math<b>Store</b></span>
    </a>
    <label class="buscar" for="buscador">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="buscador" type="search" placeholder="Buscar juegos, fichas, temas…" autocomplete="off">
    </label>
  </div>
</header>

<main class="contenido">
  <!-- Carrusel de destacados: lo rellena app.js con los recursos marcados "destacado" -->
  <section class="destacados" aria-label="Destacados">
    <div class="destacado" id="destacado"></div>
    <div class="carrusel-nav">
      <button class="flecha" id="dest-prev" type="button" aria-label="Anterior">‹</button>
      <div class="puntos" id="dest-puntos"></div>
      <button class="flecha" id="dest-next" type="button" aria-label="Siguiente">›</button>
    </div>
  </section>

  <!-- Filtros -->
  <section class="filtros" aria-label="Filtros">
    <div class="grupo-filtro">
      <span class="etiqueta-filtro">Tema</span>
      <div class="chips" id="filtro-tema" role="group" aria-label="Tema"></div>
    </div>
    <div class="grupo-filtro">
      <span class="etiqueta-filtro">Tipo</span>
      <div class="chips" id="filtro-tipo" role="group" aria-label="Tipo"></div>
    </div>
    <div class="grupo-filtro">
      <label class="etiqueta-filtro" for="filtro-nivel">Nivel</label>
      <select id="filtro-nivel">
        <option value="">Todos</option>
        <option value="primaria">Primaria</option>
        <option value="secundaria">Secundaria</option>
      </select>
    </div>
  </section>

  <section aria-labelledby="titulo-catalogo">
    <div class="cabecera-catalogo">
      <h2 id="titulo-catalogo">Catálogo</h2>
      <span class="contador" id="contador"></span>
    </div>
    <div class="rejilla" id="rejilla"></div>
    <p class="vacio" id="vacio" hidden>No hay recursos con esos filtros. Prueba a quitar alguno o cambia la búsqueda.</p>
  </section>
</main>

<footer class="pie">
  <p>MathStore · material didáctico de matemáticas · <span id="fuente-datos">catálogo local</span></p>
</footer>

<!-- Ventana de detalle (se abre al hacer clic en una tarjeta) -->
<dialog class="modal" id="modal" aria-labelledby="modal-titulo">
  <button class="cerrar" id="modal-cerrar" type="button" aria-label="Cerrar">×</button>
  <div id="modal-cuerpo"></div>
</dialog>

<!-- Orden de carga: configuración → lógica pura → juegos → catálogo → app -->
<script src="js/firebase-config.js"></script>
<script src="js/logica.js"></script>
<script src="js/juegos/carrera-tablas.js"></script>
<script src="js/juegos/fraccion-exacta.js"></script>
<script src="js/juegos/angulo-ninja.js"></script>
<script src="js/catalogo.js"></script>
<script src="js/app.js"></script>
